<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Riff — Offline</title>
    <style>
      :root {
        --bg: #0a0a0f;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --brand: #8b5cf6;
        --brand-2: #d946ef;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      main { max-width: 420px; text-align: center; }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 24px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
      }
      h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0 0 24px; color: var(--muted); font-size: 14px; line-height: 1.6; }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 12px 24px;
        min-height: 44px;
        color: #fff;
        font: inherit;
        font-size: 14.4px;
        font-weight: 600;
        cursor: pointer;
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        transition: opacity 0.15s ease, transform 0.15s ease;
      }
      button:hover { opacity: 0.9; }
      button:active { transform: scale(0.97); }
      button:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
      .status { margin-top: 16px; min-height: 20px; font-size: 13px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <div class="mark"></div>
      <h1>Can&rsquo;t reach Riff</h1>
      <p>
        Riff needs an internet connection. Check that you&rsquo;re online, then try
        again &mdash; this window will reconnect on its own once the connection is back.
      </p>
      <button id="retry" type="button">Try again</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </main>
    <script>
      // main.js passes the app origin in the query string so this page can
      // navigate back to it without needing a preload bridge.
      var appUrl = new URLSearchParams(location.search).get("url");
      var status = document.getElementById("status");

      function retry() {
        if (!appUrl) return;
        status.textContent = "Reconnecting…";
        location.href = appUrl;
      }

      document.getElementById("retry").addEventListener("click", retry);
      window.addEventListener("online", retry);

      if (!navigator.onLine) status.textContent = "No network connection detected.";
    </script>
  </body>
</html>
