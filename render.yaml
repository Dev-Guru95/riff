# Render Blueprint — Riff (Next.js + Prisma + PostgreSQL)
#
# Apply with: Render Dashboard → Blueprints → New Blueprint Instance → pick this repo.
# Env vars marked `sync: false` are NOT stored in git — set them in the Render
# dashboard (Service → Environment). Everything else is managed from this file.

services:
  - type: web
    name: riff-app
    runtime: node
    plan: free
    region: oregon # must match the database's region for the internal URL to resolve
    branch: main

    # `prisma generate` is required: without it @prisma/client ships no generated
    # types and the Next.js typecheck fails on prisma/seed.ts.
    #
    # `migrate deploy` runs last, after the build succeeds, so a broken build
    # never mutates the database schema. On a paid instance type this belongs in
    # `preDeployCommand` instead — that runs after the build but before traffic
    # shifts, so a failed migration rolls back cleanly. preDeployCommand is not
    # available on the free tier.
    # `db-doctor` runs before `migrate deploy` and prints the database's real
    # schema state to the build log. On the free tier there is no Shell, so the
    # build log is the only window into the deployed database. It is read-only
    # unless DB_RESET is set (see below).
    #
    # `db seed` is idempotent (upserts / existence checks) and creates no user
    # accounts unless SEED_DEMO_USERS=true, so it is safe on every deploy. It
    # restores badges, missions, forums, coupons and the starter course after a
    # reset.
    #
    # The trailing create-admin step is a no-op unless ADMIN_EMAIL and
    # ADMIN_PASSWORD are both set, so it is safe to leave here permanently.
    # Set both, deploy once, then clear them — re-setting them later doubles as
    # an admin password reset without ever putting the password in git.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm exec prisma generate && pnpm run build && pnpm exec tsx prisma/db-doctor.ts && pnpm exec prisma migrate deploy && pnpm exec prisma db seed && pnpm exec tsx prisma/create-admin.ts

    startCommand: pnpm run start

    envVars:
      # ---- Database -------------------------------------------------------
      # Set to the database's INTERNAL connection string, which looks like
      # postgresql://<user>:<password>@dpg-<id>-a/<dbname>
      # Copy it from Render → your database → "Connections" → Internal URL.
      # Internal is preferred over external: it stays on Render's private
      # network, so it is faster and never leaves their perimeter.
      #
      # If this database lives in the same Render account you can replace the
      # `sync: false` line with the two commented lines below and Render will
      # wire it up automatically (use the database's dashboard name):
      #   fromDatabase:
      #     name: sr-staging
      #     property: connectionString
      - key: DATABASE_URL
        sync: false

      # ---- Auth / crypto --------------------------------------------------
      # Generated once by Render and then held stable across deploys.
      # WARNING: changing JWT_SECRET invalidates every existing session;
      # changing APP_ENCRYPTION_KEY makes stored OAuth tokens undecryptable.
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        generateValue: true

      # ---- Runtime --------------------------------------------------------
      - key: NODE_VERSION
        value: "24"
      # Deliberately NOT setting NODE_ENV=production here. As a service-level
      # env var it applies to the *build* too, which makes pnpm skip
      # devDependencies — and typescript/tailwind/eslint-config-next are all
      # devDependencies, so `next build` would fail. `next build` and
      # `next start` each set NODE_ENV=production themselves anyway.
      # Public base URL for OAuth redirects and Stripe return URLs. Set this by
      # hand to the full origin including scheme, e.g.
      # https://riff-app.onrender.com — deliberately NOT `fromService: host`,
      # which yields a bare hostname with no scheme and silently produces
      # malformed redirect URLs.
      - key: APP_URL
        sync: false

      # ---- Admin bootstrap (see buildCommand above) ------------------------
      # Set both to create or promote an admin, deploy, then clear them.
      # Leave unset and prisma/create-admin.ts does nothing.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # ---- Schema rebuild (destructive — leave UNSET) -----------------------
      # Set to the exact phrase `wipe-and-rebuild` to make db-doctor drop the
      # public schema on the next deploy; `migrate deploy` then recreates every
      # table from prisma/migrations. Deletes ALL data. Deploy once, then CLEAR
      # IT — while set, every deploy wipes the database.
      - key: DB_RESET
        sync: false

      # Set to "true" ONLY in local development. It makes prisma/seed.ts create
      # demo@riff.app and admin@riff.app with passwords hardcoded in this public
      # repo. On a deployed environment use ADMIN_EMAIL/ADMIN_PASSWORD instead.
      - key: SEED_DEMO_USERS
        sync: false

      # ---- AI provider (optional — falls back to the mock reviewer) --------
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: AI_MODEL
        value: deepseek-chat

      # ---- Stripe billing (optional — UI shows "not configured" until set) -
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_PREMIUM
        sync: false

      # ---- Social OAuth (optional — manual connect until set) --------------
      - key: SOCIAL_SPOTIFY_CLIENT_ID
        sync: false
      - key: SOCIAL_SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SOCIAL_YOUTUBE_CLIENT_ID
        sync: false
      - key: SOCIAL_YOUTUBE_CLIENT_SECRET
        sync: false
      - key: SOCIAL_FACEBOOK_CLIENT_ID
        sync: false
      - key: SOCIAL_FACEBOOK_CLIENT_SECRET
        sync: false
      - key: SOCIAL_INSTAGRAM_CLIENT_ID
        sync: false
      - key: SOCIAL_INSTAGRAM_CLIENT_SECRET
        sync: false
      - key: SOCIAL_TIKTOK_CLIENT_ID
        sync: false
      - key: SOCIAL_TIKTOK_CLIENT_SECRET
        sync: false
      - key: SOCIAL_X_CLIENT_ID
        sync: false
      - key: SOCIAL_X_CLIENT_SECRET
        sync: false
