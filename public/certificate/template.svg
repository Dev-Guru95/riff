<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-label="Certificate placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <!-- PLACEHOLDER certificate — replace this file / the CertificateArtwork component. -->
  <rect width="1000" height="700" fill="url(#bg)"/>
  <rect x="34" y="34" width="932" height="632" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3"/>
  <rect x="50" y="50" width="900" height="600" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
  <text x="500" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" letter-spacing="8" fill="#ffffff" fill-opacity="0.85">CERTIFICATE OF COMPLETION</text>
  <text x="500" y="210" text-anchor="middle" font-size="54">🎓</text>
  <text x="500" y="300" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#ffffff" fill-opacity="0.8">This certifies that</text>
  <text id="cert-name" x="500" y="372" text-anchor="middle" font-family="Georgia,serif" font-size="52" font-weight="bold" fill="#ffffff">{{ARTIST_NAME}}</text>
  <line x1="330" y1="392" x2="670" y2="392" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
  <text x="500" y="440" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#ffffff" fill-opacity="0.8">has completed the</text>
  <text id="cert-program" x="500" y="486" text-anchor="middle" font-family="system-ui,sans-serif" font-size="34" font-weight="600" fill="#ffffff">{{PROGRAM_TITLE}}</text>
  <text id="cert-date" x="200" y="600" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#ffffff" fill-opacity="0.75">{{DATE}}</text>
  <text id="cert-serial" x="800" y="600" text-anchor="middle" font-family="monospace" font-size="14" fill="#ffffff" fill-opacity="0.6">#{{SERIAL}}</text>
  <text x="500" y="632" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" letter-spacing="3" fill="#ffffff" fill-opacity="0.7">SOUNDRING · RIFF</text>
</svg>
